<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="ssGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.04" />
    </linearGradient>
  </defs>

  <!-- Badge Background -->
  <rect x="6" y="6" width="48" height="48" rx="12" fill="url(#badgeGrad)" stroke="#6366f1" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Geometric 'SS' Monogram -->
  <g stroke="url(#ssGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- First 'S' -->
    <path d="M 23 20 C 23 16, 16 16, 16 20 C 16 25, 24 25, 24 30 C 24 34, 16 34, 16 30" />
    <!-- Second 'S' -->
    <path d="M 42 20 C 42 16, 35 16, 35 20 C 35 25, 43 25, 43 30 C 43 34, 35 34, 35 30" />
  </g>

  <!-- Brand Typography -->
  <text x="64" y="32" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#1e293b" letter-spacing="-0.01em">Swami Sharanam</text>
  <text x="64" y="45" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#6366f1" letter-spacing="0.08em">HALDIRAM ERP</text>
</svg>
