<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background hexagon shield -->
  <path d="M32 2 L58 14 L58 42 L32 54 L6 42 L6 14 Z"
        fill="url(#primary)"
        opacity="0.12"
        rx="4"/>
  
  <!-- Inner hexagon -->
  <path d="M32 6 L54 16 L54 40 L32 50 L10 40 L10 16 Z"
        fill="none"
        stroke="url(#primary)"
        stroke-width="1.2"
        opacity="0.4"/>

  <!-- Network/Distribution nodes -->
  <circle cx="32" cy="6" r="2.5" fill="url(#primary)"/>
  <circle cx="32" cy="6" r="1" fill="white"/>
  <circle cx="32" cy="50" r="2.5" fill="url(#primary)"/>
  <circle cx="32" cy="50" r="1" fill="white"/>
  <circle cx="10" cy="16" r="2" fill="url(#accent)"/>
  <circle cx="10" cy="16" r="0.8" fill="white"/>
  <circle cx="54" cy="16" r="2" fill="url(#accent)"/>
  <circle cx="54" cy="16" r="0.8" fill="white"/>

  <!-- Network lines -->
  <line x1="32" y1="6" x2="32" y2="50" stroke="url(#primary)" stroke-width="1" opacity="0.35"/>
  <line x1="10" y1="16" x2="32" y2="50" stroke="url(#accent)" stroke-width="0.8" opacity="0.25"/>
  <line x1="54" y1="16" x2="32" y2="50" stroke="url(#accent)" stroke-width="0.8" opacity="0.25"/>

  <!-- Stylized "S" monogram -->
  <!-- First S -->
  <path d="M24 18 C20 18 17 20 17 24 C17 28 20 30 24 30 C27 30 30 32 30 35 C30 38 27 40 24 40"
        fill="none" stroke="url(#primary)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Second S (intertwined) -->
  <path d="M40 20 C36 20 33 22 33 26 C33 30 36 32 40 32 C43 32 46 34 46 37 C46 40 43 42 40 42"
        fill="none" stroke="url(#accent)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
</svg>

